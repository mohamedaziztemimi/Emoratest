<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — Demo Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
      background: #f8f9fa;
    }
    a { text-decoration: none; color: inherit; }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #007BFF;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
    }
    .nav-links a {
      color: #666;
      font-weight: 500;
    }
    .nav-links a:hover {
      color: #007BFF;
    }

    /* Cart Container */
    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2rem;
    }

    /* Cart Items */
    .cart-items {
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }
    .empty-cart {
      padding: 3rem;
      text-align: center;
      color: #666;
    }
    .cart-item {
      display: flex;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 1px solid #e5e5e5;
    }
    .cart-item:last-child {
      border-bottom: none;
    }
    .item-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-right: 1rem;
    }
    .item-details {
      flex: 1;
    }
    .item-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .item-price {
      color: #666;
    }
    .item-quantity {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-right: 1rem;
    }
    .item-quantity button {
      width: 32px;
      height: 32px;
      border: 1px solid #e5e5e5;
      background: white;
      border-radius: 6px;
      cursor: pointer;
    }
    .item-quantity span {
      min-width: 30px;
      text-align: center;
    }
    .item-total {
      font-weight: 700;
      min-width: 80px;
      text-align: right;
    }
    .item-remove {
      color: #dc2626;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 1rem;
    }
    .item-remove:hover {
      text-decoration: underline;
    }

    /* Order Summary */
    .order-summary {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      height: fit-content;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #e5e5e5;
    }
    .summary-row:last-child {
      border-bottom: none;
    }
    .summary-row.total {
      font-size: 1.2rem;
      font-weight: 700;
      padding-top: 1rem;
      margin-top: 0.5rem;
      border-top: 2px solid #e5e5e5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 1rem;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #0056b3;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: transparent;
      color: #007BFF;
      border: 2px solid #007BFF;
      margin-top: 1rem;
    }
    .btn-secondary:hover {
      background: #007BFF;
      color: white;
    }

    /* Footer */
    footer {
      background: #1a1a1a;
      color: #999;
      text-align: center;
      padding: 2rem;
      margin-top: 4rem;
    }
    footer a {
      color: #007BFF;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Demo Store</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#products">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html" style="color: #007BFF;">Cart</a>
    </div>
  </nav>

  <!-- Cart Content -->
  <div class="container">
    <h1>Shopping Cart</h1>

    <div class="cart-layout">
      <!-- Cart Items -->
      <div class="cart-items" id="cart-items">
        <!-- Items will be rendered here -->
      </div>

      <!-- Order Summary -->
      <div class="order-summary">
        <h3>Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span id="shipping">$0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="total">$0.00</span>
        </div>
        <button class="btn" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
        <button class="btn btn-secondary" onclick="window.location.href='index.html'">Continue Shopping</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>Powered by <a href="https://emoratest.com" target="_blank">EmoraTest</a> — Emotion ML + A/B Testing Platform</p>
  </footer>

  <!-- EmoraTest SDK -->
  <script src="http://localhost:8000/static/sdk/emoratest.umd.js"></script>
  <script>
    const SDK_KEY = "YOUR_SDK_KEY_HERE"; // Replace with your actual SDK key from https://emoratest.com/dashboard/settings
    const API_URL = "http://localhost:8000";

    // Product info for display
    const productInfo = {
      wireless_headphones: { name: "Wireless Headphones", emoji: "🎧", color: "#667eea" },
      smart_watch: { name: "Smart Watch", emoji: "⌚", color: "#f5576c" },
      running_shoes: { name: "Running Shoes", emoji: "👟", color: "#4facfe" }
    };

    let cart = JSON.parse(localStorage.getItem('demo_cart') || '[]');

    function renderCart() {
      const container = document.getElementById('cart-items');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <p style="font-size: 3rem; margin-bottom: 1rem;">🛒</p>
            <h3>Your cart is empty</h3>
            <p>Add some products to get started!</p>
          </div>
        `;
        updateSummary();
        return;
      }

      let html = '';
      cart.forEach((item, index) => {
        const info = productInfo[item.id] || { name: item.name, emoji: "📦", color: "#999" };
        const total = item.price * item.quantity;
        html += `
          <div class="cart-item">
            <div class="item-image" style="background: ${info.color}20; border: 2px solid ${info.color}">
              ${info.emoji}
            </div>
            <div class="item-details">
              <div class="item-name">${item.name || info.name}</div>
              <div class="item-price">$${item.price.toFixed(2)}</div>
            </div>
            <div class="item-quantity">
              <button onclick="updateQuantity(${index}, -1)">−</button>
              <span>${item.quantity}</span>
              <button onclick="updateQuantity(${index}, 1)">+</button>
            </div>
            <div class="item-total">$${total.toFixed(2)}</div>
            <div class="item-remove" onclick="removeItem(${index})">Remove</div>
          </div>
        `;
      });
      container.innerHTML = html;
      updateSummary();
    }

    function updateQuantity(index, delta) {
      cart[index].quantity = Math.max(1, cart[index].quantity + delta);
      localStorage.setItem('demo_cart', JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem('demo_cart', JSON.stringify(cart));
      renderCart();
    }

    function updateSummary() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const shipping = subtotal > 50 ? 0 : 5.99;
      const total = subtotal + shipping;

      document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
      document.getElementById('shipping').textContent = shipping === 0 ? 'FREE' : '$' + shipping.toFixed(2);
      document.getElementById('total').textContent = '$' + total.toFixed(2);
    }

    // Initialize SDK
    (async function initSDK() {
      renderCart();

      if (typeof EmoraTest !== 'undefined') {
        try {
          await EmoraTest.init({
            sdkKey: SDK_KEY,
            apiUrl: API_URL,
            debug: true
          });
          console.log('[Demo Store] SDK initialized, session:', EmoraTest.getSessionId());
        } catch (err) {
          console.error('[Demo Store] SDK init failed:', err);
        }
      }
    })();
  </script>
</body>
</html>
