name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "🚀 Deploying EmoraTest to production..."

            # Navigate to app directory
            cd /opt/emoratest

            # Pull latest code
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            # Check if docker-compose.prod.yml changed (needs full rebuild)
            if git diff --name-only HEAD~1 HEAD | grep -q "docker-compose.prod.yml"; then
              echo "🐳 Compose file changed - rebuilding all containers..."
              docker compose -f docker-compose.prod.yml --env-file .env build
            else
              echo "🐳 Rebuilding backend and frontend only..."
              docker compose -f docker-compose.prod.yml --env-file .env build backend frontend
            fi

            # Run database migrations
            echo "🗄️ Running database migrations..."
            docker compose -f docker-compose.prod.yml --env-file .env exec -T backend alembic upgrade head

            # Restart all services
            echo "🔄 Restarting services..."
            docker compose -f docker-compose.prod.yml --env-file .env up -d

            # Cleanup old images (optional)
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            echo ""
            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml --env-file .env ps
