name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            set -e

            echo "🚀 Deploying EmoraTest to production..."

            # Navigate to app directory
            cd /opt/emoratest

            # Pull latest code
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            # Rebuild backend and frontend (no-cache for frontend to handle dependency changes)
            echo "🐳 Rebuilding containers..."
            docker compose -f docker-compose.prod.yml --env-file .env build backend
            docker compose -f docker-compose.prod.yml --env-file .env build --no-cache frontend

            # Restart all services
            echo "🔄 Restarting services..."
            docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate --remove-orphans

            # Wait for backend to be healthy
            echo "⏳ Waiting for backend to be ready..."
            timeout 60 bash -c 'until docker compose -f docker-compose.prod.yml --env-file .env exec -T backend python -c "import sys; sys.exit(0)" 2>/dev/null; do sleep 2; done' || echo "⚠️ Backend not fully ready, continuing anyway..."

            # Run database migrations (using --rm for one-off container)
            echo "🗄️ Running database migrations..."
            docker compose -f docker-compose.prod.yml --env-file .env run --rm backend alembic upgrade head

            # Cleanup old images (optional)
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            echo ""
            echo "📊 Container status:"
            docker compose -f docker-compose.prod.yml --env-file .env ps
