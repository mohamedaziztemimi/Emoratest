[project]
name = "emoratest-backend"
version = "0.1.0"
description = "EmoraTest API — Emotion ML + A/B Testing Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "slowapi>=0.1.9",
    "websockets>=12.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "UP042", # Use StrEnum instead of str, Enum (stylistic, not critical)
    "SIM102", # Nested if statements (sometimes clearer as-is)
    "E501",  # Line too long (handled by formatter in practice)
    "E712",  # Comparison to True (stylistic choice)
    "B905",  # zip() without strict= (not critical for our use cases)
    "E402",  # Module import not at top (intentional for conditional imports)
    "F811",  # Redefinition (intentional re-exports)
    "SIM108", # Use ternary instead of if-else (less readable in many cases)
]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]  # Depends() in function defaults is standard FastAPI
"app/core/auth.py" = ["B008"]  # FastAPI dependency injection pattern
"app/schemas/__init__.py" = ["F403", "F405"]  # Star imports are intentional for re-exports
"app/services/*.py" = ["F841", "F821"]  # TODO: Fix unused variables and undefined names
"tests/*.py" = ["F841", "F821", "SIM108"]  # Test code patterns

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
