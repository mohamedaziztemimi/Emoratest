[project]
name = "emoratest-ml"
version = "0.1.0"
description = "EmoraTest ML training pipeline — behavioral prediction models"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "shap>=0.46.0",
    "mlflow>=2.16.0",
    "sqlalchemy>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "imbalanced-learn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "UP042", # Use StrEnum instead of str, Enum
    "SIM102", # Nested if statements
    "E501",  # Line too long
    "E712",  # Comparison to True
    "B905",  # zip() without strict=
    "B007",  # Unused loop control variable
    "F841",  # Unused local variables
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
