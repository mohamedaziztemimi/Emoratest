# ────────────────────────────────────────────────────────────────
# docker-compose.yml - Base configuration (production + dev)
#
# Development: bind mounts and hot-reload are in docker-compose.override.yml
# Production: use `docker compose -f docker-compose.yml up` to skip overrides
# ────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emoratest
      POSTGRES_USER: emoratest
      POSTGRES_PASSWORD: emoratest_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emoratest"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://emoratest:emoratest_secret@postgres:5432/emoratest
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
      JWT_SECRET_KEY: change-me-generate-with-openssl-rand-hex-32
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/app/ml_artifacts:ro
    # Additional volumes defined in docker-compose.override.yml for development
    # Production uses the image's built-in code (no bind mounts)

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    # Volumes defined in docker-compose.override.yml for development
    # Production uses the image's built-in code (no bind mounts)

volumes:
  pgdata:
